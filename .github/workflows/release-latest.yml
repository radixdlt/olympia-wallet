on:
  workflow_dispatch:
  push:
    branches:
      - main

name: release-latest
jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '18'
          check-latest: true
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: mark latest
        uses: ./.github/actions/mark-latest

      - name: Install Apple certificates
        if: matrix.os == 'macos-15'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_NAME=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERTS_PATH="$RUNNER_TEMP/certificates.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          echo "$MAC_CERTS" | base64 --decode > "$CERTS_PATH"
          security import "$CERTS_PATH" -k "$KEYCHAIN_NAME" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_NAME" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          echo "CSC_LINK=$CERTS_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CERTS_PASSWORD" >> "$GITHUB_ENV"

      - name: Build/release Electron app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          yarn electron:build --publish=never
      - name: Move Files
        shell: bash
        run: ./move_dist.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: olympia-wallet-linux
          path: dist-linux

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: olympia-wallet-mac
          path: dist-mac

      - name: Upload Win Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: olympia-wallet-win
          path: dist-win
